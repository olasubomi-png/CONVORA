# Drains notification_deliveries (PUSH / EMAIL / WHATSAPP) on a short interval.
# Use this when the Vercel plan cannot schedule every-minute crons (Hobby = daily only).
# Required repository secrets:
#   CONVORA_APP_URL          e.g. https://convora-fawn.vercel.app
#   NOTIFICATION_WORKER_SECRET or CRON_SECRET (same value configured on Vercel)
name: Notification worker

on:
  schedule:
    # Every 5 minutes
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  drain:
    runs-on: ubuntu-latest
    steps:
      - name: Invoke notification worker
        env:
          APP_URL: ${{ secrets.CONVORA_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          NOTIFICATION_WORKER_SECRET: ${{ secrets.NOTIFICATION_WORKER_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${APP_URL:-}" ]; then
            echo "CONVORA_APP_URL secret not set — skipping worker invoke."
            exit 0
          fi
          SECRET="${CRON_SECRET:-${NOTIFICATION_WORKER_SECRET:-}}"
          if [ -z "${SECRET}" ]; then
            echo "CRON_SECRET / NOTIFICATION_WORKER_SECRET not set — skipping."
            exit 0
          fi
          URL="${APP_URL%/}/api/notifications/worker"
          code=$(curl -sS -o /tmp/worker-body.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${SECRET}" \
            -H "Content-Type: application/json" \
            --max-time 60 \
            "$URL" || true)
          echo "HTTP $code"
          head -c 500 /tmp/worker-body.json || true
          echo
          if [ "$code" != "200" ]; then
            echo "Worker invoke failed with HTTP $code"
            exit 1
          fi
